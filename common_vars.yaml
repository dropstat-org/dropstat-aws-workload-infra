# ============================================================
# dropstat-aws-workload-infra — common_vars.yaml
# Shared across all environments. Override per-env in env.hcl
# ============================================================

org_name: dropstat
region:   us-east-2

# Platform-infra state bucket (management account — read only)
platform_infra_state_bucket: "dropstat-tfstate-174917982419"

# ECR registry — shared-services account
# Update with real shared-services account ID after platform-infra step 16
ecr_registry: "REPLACE_WITH_SHARED_SERVICES_ACCOUNT_ID.dkr.ecr.us-east-2.amazonaws.com"

# ECR repository names (same across all envs — tag differentiates)
ecr_repos:
  dropstat_api:       "dropstat-prod"
  integrations_rest:  "dropstat-integrations-rest"
  nursa:              "dropstat-nursa"

# SQS queue base names — environment suffix appended per env
sqs_queues:
  - ftp-transfer-integration-queue
  - ftp-transfer-queue
  - shifts-queue
  - staff-shift-sms-queue

# MQ engine
mq:
  engine_type:    "ACTIVEMQ"
  engine_version: "5.17.6"
